name: Deploy pythonapp to GCP Appengine

on:
 push:
  branches:
    - main
 workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1


jobs:
 test:
   name: Test Python Application
   runs-on: ubuntu-latest
   
   steps:
     - name: checkout sourc code
       uses: actions/checkout@v4

     - name: Setup python
       uses: actions/setup-python@v5
       with:
         python-version: "3.12"

     - name: Install depenedencies
       run: | 
         python -m pip install --upgrade pipeline
         pip install -r requirements.txt

     - name: Run python syntax check
       run: |
         python -m compileall .

     - name: Run application test
       run: |
         python -c "from app import app: print('Application import successfully')"