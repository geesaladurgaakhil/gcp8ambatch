name: Deploy pythonapp to GCP Appengine

on:
 push:
  branches:
    - main
 workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1


jobs:
 test:
   name: Test Python Application
   runs-on: ubuntu-latest
   
   steps:
     - name: checkout sourc code
       uses: actions/checkout@v7

     - name: Setup python
       uses: actions/setup-python@v5
       with:
         python-version: "3.12"

     - name: Install depenedencies
       run: | 
         python -m pip install --upgrade pipeline
         pip install -r requirements.txt

    #  - name: Run python syntax check
    #    run: |
    #      python -m compileall .

     - name: Run application test
       run: |
         python -c "from app import app; print('Application import successfully')"
 deploy:
  name: Deploy to app engine
  needs: test
  runs-on: ubuntu-latest
  permissions:
   contents: read
   id-token: write

  steps:
    - name: Checkout source code
      uses: actions/checkout@v7
    
    - name: Authenticate to Google cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        project_id: ${{ env.PROJECT_ID }}
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

    - name: Setup gcloud
      uses: google-github-actions/setup-gcloud@v2

    - name: Verify GCP authentication
      run: |
         gcloud auth list
         gcloud config list

    - name: Validate APP engine config
      run: |
        gcloud app describe

    - name: Deploy Application to app engine
      run: |
        gcloud app deploy app.yaml \
        --project=$PROJECT_ID
    
    - name: Get App Engine URL
      id: app-url
      run: |
        URL=$(gcloud app browse --- project=$PROJECT_ID --no-lanch-browser 2>&1 | tail -1)
        echo "Application Deployed Successfully"
        echo "URL: $URL"