apiVersion: v1

kind: Service

metadata:
  name: {{ include "pythonapp.fullname" . }}

  labels:
    {{- include "pythonapp.labels" . | nindent 4 }}

spec:

  type: {{ .Values.service.type }}

  selector:
    {{- include "pythonapp.selectorLabels" . | nindent 4 }}

  ports:

    - name: http

      port: {{ .Values.service.port }}

      targetPort: {{ .Values.service.targetPort }}

      protocol: TCP